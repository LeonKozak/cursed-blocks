# Builds the game and publishes it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]   # run on every push to main
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

# Permissions the job's token needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time. A newer push waits in line instead of
# cancelling a deployment that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci          # clean install exactly from package-lock.json
      - run: npm run build   # type check + Vite build into dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
